# This docker-compose.yml is for standalone deployment.
# For integration with your existing setup, add the backend service to your main docker-compose.yml
# and use the Caddyfile configuration provided in CADDY_INTEGRATION.md
# Note: Frontend is built locally and served by Caddy (no Docker container needed)

version: '3.8'

services:
  khongbietangi_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khongbietangi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    networks:
      - server_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
